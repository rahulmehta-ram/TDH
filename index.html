<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamnna Dupatta Hub | Official Portfolio</title>
    <!-- Core Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase Services (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            margin: 0; 
            overflow-x: hidden; 
            background-color: #FF2EB0; 
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { display: none; }
        
        .animate-in { 
            animation: in 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; 
        }
        @keyframes in {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .bento-card { 
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
            cursor: pointer; 
            border: 1px solid rgba(255,255,255,0.1); 
        }
        .bento-card:hover { 
            transform: translateY(-5px) scale(1.02); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); 
        }
        .bento-card:active { transform: scale(0.95); }
        
        .success-toast { 
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        @keyframes slideUp { 
            from { transform: translateY(100%); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }

        .input-glow:focus {
            box-shadow: 0 0 0 4px rgba(255, 46, 176, 0.1);
            border-color: #FF2EB0 !important;
        }

        .message-bubble {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px border rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDYxhq1itKAuE0Gtk7k2irVXRDOGEKqSJc",
            authDomain: "tamnnadupattahub-3255c.firebaseapp.com",
            projectId: "tamnnadupattahub-3255c",
            storageBucket: "tamnnadupattahub-3255c.firebasestorage.app",
            messagingSenderId: "976366593432",
            appId: "1:976366593432:web:bec3655409f620b01ab7ed",
            measurementId: "G-5KRYTFNLSV"
        };

        const siteAppId = "tamnna-dupatta-hub-live";
        const googleReviewLink = "https://g.page/r/CQ1U5-J70bkVEBM/review";

        // Initialize Firebase
        let db = null;
        let auth = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();
        } catch (e) { 
            console.error("Firebase failed to load."); 
        }

        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [view, setView] = useState('portfolio');
            const [passInput, setPassInput] = useState('');
            const [error, setError] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [showSuccess, setShowSuccess] = useState(false);
            const [isLoading, setIsLoading] = useState(true);
            
            // App Links State
            const [links, setLinks] = useState({
                instagram: "https://www.instagram.com/tamnna_dupatta",
                google_rate: googleReviewLink,
                meesho: "https://www.meesho.com/TAMNNACREATION?ms=2",
                best_seller: "",
                new_releases: "",
                culture: "https://tamnna-dupatta-hub2.odoo.com/",
                amazon: "",
                flipkart: ""
            });

            // Random Messages List (Telegram Removed Completely)
            const pushMessages = [
                { emoji: "✨", title: "Love your Dupatta?", text: "Please rate us on Google & your purchase platform! Your support means the world to us." },
                { emoji: "⭐", title: "Share Your Style!", text: "Rate us on Google and let others know about your experience with Tamnna Hub." },
                { emoji: "🎁", title: "Your Feedback Matters", text: "Purchased from Meesho or Amazon? Please leave a review and help our small brand grow!" },
                { emoji: "💬", title: "How did we do?", text: "We strive for 5 stars! Rate us on Google and help us improve our services for you." },
                { emoji: "🛍️", title: "Shopping Reward", text: "Rate your purchase on Meesho/Flipkart! Real reviews help our community shop better." },
                { emoji: "❤️", title: "Support Small Business", text: "A quick 5-star review on Google helps us reach more dupatta lovers like you!" },
                { emoji: "📍", title: "Found Us on Google?", text: "Leave a 5-star review with a photo of your dupatta to help other shoppers!" },
                { emoji: "🌟", title: "Authentic Quality", text: "Loved the fabric? Share your thoughts on Google Reviews today!" },
                { emoji: "🔥", title: "Happy Customers!", text: "We love seeing you happy. Please share your feedback on Google and purchase sites!" }
            ];

            const currentMessage = useMemo(() => {
                const index = Math.floor(Math.random() * pushMessages.length);
                return pushMessages[index];
            }, []);

            useEffect(() => {
                if (!auth || !db) return;
                auth.signInAnonymously().catch(() => console.log("Standard Access"));
                
                const docRef = db.collection('artifacts').doc(siteAppId).collection('public').doc('data').collection('config').doc('settings');
                const unsubscribe = docRef.onSnapshot(snap => {
                    if (snap.exists) {
                        setLinks(prev => ({...prev, ...snap.data(), google_rate: googleReviewLink }));
                    }
                    setIsLoading(false);
                }, err => {
                    setIsLoading(false);
                });
                return () => unsubscribe();
            }, []);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (passInput === 'Tamnna@123') {
                    setView('admin');
                    setError('');
                } else {
                    setError('Wrong Security Password');
                }
            };

            const handleSaveChanges = async () => {
                setIsSaving(true);
                setError('');
                try {
                    const docRef = db.collection('artifacts').doc(siteAppId).collection('public').doc('data').collection('config').doc('settings');
                    await docRef.set(links);
                    setShowSuccess(true);
                    setTimeout(() => {
                        setShowSuccess(false);
                        setView('portfolio');
                        setPassInput('');
                    }, 2000);
                } catch (err) {
                    setError('Save failed.');
                } finally {
                    setIsSaving(false);
                }
            };

            if (view === 'login') return (
                <div className="min-h-screen flex items-center justify-center p-6 text-white">
                    <div className="bg-white/10 backdrop-blur-3xl p-10 rounded-[48px] w-full max-w-sm border border-white/20 shadow-2xl animate-in">
                        <div className="flex justify-between items-center mb-10">
                            <h2 className="text-3xl font-black uppercase tracking-tighter">Admin</h2>
                            <button onClick={() => setView('portfolio')} className="text-2xl hover:opacity-50">✕</button>
                        </div>
                        <form onSubmit={handleAdminLogin} className="space-y-8">
                            <input 
                                type="password" 
                                className="w-full bg-white/10 border-2 border-white/5 rounded-3xl py-5 px-8 outline-none text-center text-xl tracking-widest focus:border-yellow-300"
                                value={passInput}
                                onChange={(e) => setPassInput(e.target.value)}
                                placeholder="••••••••"
                            />
                            {error && <p className="text-yellow-300 text-center font-bold text-xs uppercase">{error}</p>}
                            <button className="w-full bg-yellow-300 text-pink-600 font-black py-5 rounded-3xl shadow-xl hover:scale-105 active:scale-95 transition-all">
                                ACCESS PANEL
                            </button>
                        </form>
                    </div>
                </div>
            );

            if (view === 'admin') return (
                <div className="min-h-screen bg-[#F8FAFC] p-6 font-sans pb-40">
                    <div className="max-w-md mx-auto">
                        <div className="flex justify-between items-center mb-10">
                            <h1 className="text-4xl font-black text-pink-600 uppercase tracking-tighter">Editor</h1>
                            <button onClick={() => setView('portfolio')} className="bg-white p-4 rounded-3xl shadow-sm text-slate-400">✕</button>
                        </div>
                        <div className="space-y-4">
                            {Object.keys(links).map(key => (
                                <div key={key} className="bg-white p-5 rounded-[32px] shadow-sm border border-slate-100">
                                    <label className="text-[10px] font-black uppercase text-slate-400 block mb-2 ml-1">{key.replace('_', ' ')}</label>
                                    <input 
                                        className="w-full bg-slate-50 rounded-2xl px-5 py-4 text-sm outline-none border-2 border-transparent focus:border-pink-500"
                                        value={links[key] || ''}
                                        disabled={key === 'google_rate'}
                                        onChange={(e) => setLinks({...links, [key]: e.target.value})}
                                    />
                                    {key === 'google_rate' && <p className="text-[8px] text-pink-500 mt-1 uppercase font-bold">Standardized Link Locked</p>}
                                </div>
                            ))}
                        </div>
                        <div className="fixed bottom-0 left-0 right-0 p-8 bg-gradient-to-t from-[#F8FAFC] z-50">
                            <button onClick={handleSaveChanges} disabled={isSaving} className="w-full bg-pink-600 text-white font-black py-6 rounded-[32px] shadow-2xl active:scale-95 transition-all">
                                {isSaving ? "SAVING..." : "PUBLISH UPDATES"}
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen px-6 py-10 max-w-md mx-auto relative flex flex-col">
                    <header className="mb-8 animate-in">
                        <div className="flex justify-between items-start">
                            <div>
                                <h1 className="text-[48px] leading-[0.85] font-black text-yellow-300 tracking-tighter uppercase drop-shadow-xl">
                                    TAMNNA<br/>DUPATTA<br/>HUB
                                </h1>
                                <p className="mt-4 text-white/50 font-bold text-[10px] uppercase tracking-[0.4em] ml-1">Official Hub</p>
                            </div>
                            <div className="bg-white/20 p-3 rounded-full backdrop-blur-md">
                                <span className="text-xl">🇮🇳</span>
                            </div>
                        </div>
                    </header>

                    {/* Dynamic Push Message Bubble (Focused on Reviews) */}
                    <div className="mb-8 animate-in message-bubble p-6 rounded-[40px] border border-white/20 shadow-xl" style={{animationDelay: '100ms'}}>
                        <div className="flex gap-4">
                            <div className="text-4xl">{currentMessage.emoji}</div>
                            <div>
                                <h4 className="text-white font-black uppercase text-sm tracking-tight">{currentMessage.title}</h4>
                                <p className="text-white/80 text-[11px] leading-relaxed mt-1 font-medium">{currentMessage.text}</p>
                            </div>
                        </div>
                        <div className="mt-4 flex">
                             <a href={googleReviewLink} target="_blank" className="bg-white text-pink-600 text-[10px] font-black px-6 py-2.5 rounded-full uppercase tracking-widest shadow-sm hover:scale-105 active:scale-95 transition-transform">Rate us on Google</a>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-5 auto-rows-[160px]">
                        {/* Google Rate - Featured Primary */}
                        <a href={googleReviewLink} target="_blank" className="row-span-2 bg-white rounded-[48px] p-8 shadow-2xl flex flex-col items-center justify-center animate-in bento-card" style={{animationDelay: '200ms'}}>
                            <div className="text-7xl mb-6 animate-bounce">⭐</div>
                            <h3 className="text-xl font-black text-purple-600 uppercase leading-none text-center">Rate On<br/>Google</h3>
                            <p className="text-[8px] font-bold text-slate-400 mt-2 uppercase tracking-widest">Help us grow</p>
                            <div className="mt-6 w-10 h-10 bg-purple-50 rounded-full flex items-center justify-center text-purple-400 font-black">→</div>
                        </a>

                        {/* Instagram */}
                        <a href={links.instagram} target="_blank" className="bg-white rounded-[48px] p-5 shadow-xl flex flex-col items-center justify-center animate-in bento-card" style={{animationDelay: '300ms'}}>
                             <div className="w-14 h-14 bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 rounded-[20px] mb-3 shadow-lg flex items-center justify-center rotate-3">
                                <svg viewBox="0 0 24 24" className="w-8 h-8 text-white fill-none stroke-current stroke-[1.8]">
                                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                                    <circle cx="12" cy="12" r="4"></circle>
                                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                                </svg>
                             </div>
                             <h3 className="text-base font-black text-blue-600 uppercase leading-none text-center">Insta<br/><span className="text-[10px] opacity-40 font-bold">Trend</span></h3>
                        </a>

                        {/* Culture */}
                        <a href={links.culture} target="_blank" className="bg-white rounded-[48px] p-5 shadow-xl flex flex-col items-center justify-center animate-in bento-card" style={{animationDelay: '400ms'}}>
                             <div className="text-5xl mb-2">✨</div>
                             <h3 className="text-sm font-black text-purple-600 uppercase leading-none text-center">Brand<br/><span className="text-[10px] opacity-40 font-bold">Culture</span></h3>
                        </a>

                        {/* Marketplace Row */}
                        <a href={links.meesho} target="_blank" className="bg-white rounded-[48px] p-5 shadow-xl flex flex-col items-center justify-center animate-in bento-card" style={{animationDelay: '500ms'}}>
                             <div className="text-5xl mb-2">🛍️</div>
                             <h3 className="text-sm font-black text-pink-500 uppercase tracking-tighter">Meesho</h3>
                        </a>
                        
                        <a href={links.amazon || '#'} target="_blank" className={`bg-white rounded-[48px] p-5 shadow-xl flex flex-col items-center justify-center animate-in bento-card ${!links.amazon && 'opacity-40 grayscale'}`} style={{animationDelay: '600ms'}}>
                             <div className="text-4xl mb-2">📦</div>
                             <h3 className="text-sm font-black text-orange-500 uppercase tracking-tighter">Amazon</h3>
                        </a>

                        <a href={links.flipkart || '#'} target="_blank" className={`bg-white rounded-[48px] p-5 shadow-xl flex flex-col items-center justify-center animate-in bento-card ${!links.flipkart && 'opacity-40 grayscale'}`} style={{animationDelay: '700ms'}}>
                             <div className="text-4xl mb-2">🛒</div>
                             <h3 className="text-sm font-black text-blue-500 uppercase tracking-tighter">Flipkart</h3>
                        </a>

                        <a href={links.best_seller || '#'} target="_blank" className={`bg-white rounded-[48px] p-5 shadow-xl flex flex-col items-center justify-center animate-in bento-card ${!links.best_seller && 'opacity-40 grayscale'}`} style={{animationDelay: '800ms'}}>
                             <div className="text-4xl mb-2">🚀</div>
                             <h3 className="text-sm font-black text-blue-600 uppercase tracking-tighter">Best Buy</h3>
                        </a>
                    </div>

                    <footer className="mt-20 text-center space-y-10 pb-16">
                        <button onClick={() => setView('login')} className="bg-white/10 text-white/40 px-8 py-4 rounded-full text-[9px] font-black uppercase tracking-[0.4em] border border-white/5 active:scale-95 transition-all">
                            Admin Login
                        </button>
                        
                        <div className="space-y-1">
                            <p className="text-[9px] uppercase tracking-[0.5em] text-white/30 font-medium">© 2024 TAMNNA DUPATTA HUB</p>
                            <p className="text-[7px] uppercase tracking-[0.2em] text-white/20 italic">Designed with love for our customers</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
