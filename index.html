<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamnna Dupatta Hub | Official Portfolio</title>
    
    <!-- Core Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Configure Babel to use Classic JSX Runtime (React.createElement) instead of automatic runtime imports -->
    <script>
        Babel.registerPreset('classic-react', {
            presets: [
                [Babel.availablePresets['react'], { runtime: 'classic' }]
            ]
        });
    </script>

    <!-- Firebase Services (Compat Version for Perfect Babel Integration) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neo-bg: #FF9ECA;
            --neo-light: #FFC6E3;
            --neo-dark: #DF75A0;
            --neo-text: #4C0020;
            --neo-text-muted: #802A50;
            --neo-accent: #FF1A93;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            margin: 0; 
            overflow-x: hidden; 
            background: var(--neo-bg);
            color: var(--neo-text);
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { display: none; }
        
        /* Extruded Neumorphic elements (Pop out) */
        .neo-embossed {
            background: var(--neo-bg);
            box-shadow: 8px 8px 18px var(--neo-dark), -8px -8px 18px var(--neo-light);
            border-radius: 28px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .neo-embossed-sm {
            background: var(--neo-bg);
            box-shadow: 4px 4px 10px var(--neo-dark), -4px -4px 10px var(--neo-light);
            border-radius: 18px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Hover and active spring mechanics */
        .neo-interactive {
            cursor: pointer;
        }

        .neo-interactive:hover {
            transform: translateY(-2px);
            box-shadow: 10px 10px 22px var(--neo-dark), -10px -10px 22px var(--neo-light);
        }

        .neo-interactive:active {
            transform: translateY(1px);
            box-shadow: inset 4px 4px 10px var(--neo-dark), inset -4px -4px 10px var(--neo-light);
        }

        /* Recessed Neumorphic elements (Pressed in) */
        .neo-recessed {
            background: var(--neo-bg);
            box-shadow: inset 5px 5px 12px var(--neo-dark), inset -5px -5px 12px var(--neo-light);
            border-radius: 20px;
        }

        /* Ambient spinning for decorative elements */
        .mandala-spin {
            animation: spin 12s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Transition animations */
        .animate-fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen relative p-1">
    <div id="root"></div>

    <!-- Standard Babel Compilation Script Block with custom registered classic react preset -->
    <script type="text/babel" data-presets="classic-react">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = typeof __firebase_config !== 'undefined'
            ? JSON.parse(__firebase_config)
            : {
                apiKey: "AIzaSyDYxhq1itKAuE0Gtk7k2irVXRDOGEKqSJc",
                authDomain: "tamnnadupattahub-3255c.firebaseapp.com",
                projectId: "tamnnadupattahub-3255c",
                storageBucket: "tamnnadupattahub-3255c.firebasestorage.app",
                messagingSenderId: "976366593432",
                appId: "1:976366593432:web:bec3655409f620b01ab7ed",
                measurementId: "G-5KRYTFNLSV"
            };

        const appId = typeof __app_id !== 'undefined' ? __app_id : "tamnna-dupatta-hub-live";
        const googleReviewLink = "https://g.page/r/CQ1U5-J70bkVEBM/review";

        // Safe Firebase Initialization & Fallback using Globally Registered Compat APIs
        let auth = null;
        let db = null;
        let isFirebaseAvailable = false;

        try {
            if (window.firebase) {
                const app = !firebase.apps.length ? firebase.initializeApp(firebaseConfig) : firebase.app();
                auth = firebase.auth();
                db = firebase.firestore();
                isFirebaseAvailable = true;
            }
        } catch (e) {
            console.warn("Firebase initialization skipped or unavailable. Running safely in high-reliability local memory mode.");
        }

        const App = () => {
            const [view, setView] = useState('portfolio'); // 'portfolio', 'login', 'admin'
            const [passInput, setPassInput] = useState('');
            const [error, setError] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [user, setUser] = useState(null);

            // App Links State including newly added destinations
            const [links, setLinks] = useState({
                instagram: "https://www.instagram.com/tamnna_dupatta",
                whatsapp: "https://wa.me/919763665932",
                telegram: "https://t.me/tamnna_dupatta",
                website: "https://tamnna-dupatta-hub2.odoo.com/",
                google_rate: googleReviewLink,
                meesho: "https://www.meesho.com/TAMNNACREATION?ms=2",
                best_seller: "",
                new_releases: "",
                amazon: "",
                flipkart: ""
            });

            // Neumorphic reviewer brand updates
            const pushMessages = [
                { emoji: "🌸", title: "LOVE YOUR DUPATTA?", text: "Rate us 5-stars on Google! Your support feeds our family-owned craft team." },
                { emoji: "💖", title: "SHARE YOUR ETHNIC STYLE!", text: "Drop a quick Google review and share a beautiful snap of your dupatta patterns!" },
                { emoji: "📦", title: "REVIEW REWARD", text: "Ordered from Meesho or Amazon? Leave feedback and let us know about your experience!" },
                { emoji: "👑", title: "STRIVING FOR 5-STARS!", text: "Your feedback helps us perfect traditional Indian weaving, rich colors, and soft textures." },
                { emoji: "🎀", title: "FESTIVE SEASONS COLLAB", text: "Loved the quality? A quick Google Review keeps us motivated to continue our artistic weaving." }
            ];

            const currentMessage = useMemo(() => {
                const index = Math.floor(Math.random() * pushMessages.length);
                return pushMessages[index];
            }, []);

            // Toast helper to show elegant alerts instead of default popups
            const triggerToast = (message) => {
                setToastMessage(message);
                setTimeout(() => setToastMessage(null), 3000);
            };

            // 1. Firebase Authentication State
            useEffect(() => {
                if (!isFirebaseAvailable || !auth) {
                    setIsLoading(false);
                    return;
                }

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (e) {
                        console.warn("Anonymous auth failed, running safely in public viewing mode.", e);
                    }
                };

                initAuth();
                const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                });

                return () => unsubscribe();
            }, []);

            // 2. Safe Firestore Listening
            useEffect(() => {
                if (!isFirebaseAvailable || !db) {
                    setIsLoading(false);
                    return;
                }
                if (!user) return; 

                const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('config').doc('settings');

                const unsubscribe = docRef.onSnapshot((snap) => {
                    if (snap.exists) {
                        setLinks(prev => ({
                            ...prev, 
                            ...snap.data(), 
                            google_rate: googleReviewLink 
                        }));
                    }
                    setIsLoading(false);
                }, (err) => {
                    console.error("Firestore read skipped. Operating on native settings.", err);
                    setIsLoading(false);
                });

                return () => unsubscribe();
            }, [user]);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (passInput === 'Tamnna@123') {
                    setView('admin');
                    setError('');
                } else {
                    setError('WRONG PASSWORD. TRY AGAIN.');
                }
            };

            const handleSaveChanges = async () => {
                setIsSaving(true);
                setError('');
                
                if (!isFirebaseAvailable || !db) {
                    setTimeout(() => {
                        setIsSaving(false);
                        triggerToast("Saved locally (Offline Mode)");
                        setView('portfolio');
                        setPassInput('');
                    }, 1000);
                    return;
                }

                try {
                    const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('config').doc('settings');
                    await docRef.set(links);
                    triggerToast("Published successfully!");
                    setTimeout(() => {
                        setView('portfolio');
                        setPassInput('');
                    }, 1500);
                } catch (err) {
                    console.error(err);
                    setError('Failed to update. Verify access permissions.');
                } finally {
                    setIsSaving(false);
                }
            };

            if (isLoading) {
                return (
                    <div className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#FF9ECA] text-[#4C0020] p-6">
                        <div className="neo-embossed p-6 mb-6 flex items-center justify-center bg-[#FF9ECA]">
                            <svg className="w-16 h-16 text-[#FF1A93] mandala-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z" />
                            </svg>
                        </div>
                        <h2 className="text-2xl font-black tracking-widest uppercase text-[#4C0020]">TAMNNA HUB</h2>
                        <p className="text-[10px] font-bold uppercase tracking-widest mt-2 text-[#802A50]">Weaving Tradition & Love...</p>
                    </div>
                );
            }

            // Neumorphic Toast Alert Component
            const Toast = () => toastMessage ? (
                <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-[#FF9ECA] neo-embossed px-6 py-4 flex items-center gap-3 animate-fade-in border border-white/20">
                    <span className="text-[#FF1A93] text-xl font-bold">🌸</span>
                    <span className="text-xs font-black tracking-wider uppercase text-[#4C0020]">{toastMessage}</span>
                </div>
            ) : null;

            // ADMIN LOGIN VIEW
            if (view === 'login') return (
                <div className="min-h-screen flex items-center justify-center p-6 text-[#4C0020] animate-fade-in">
                    <Toast />
                    <div className="neo-embossed p-8 w-full max-w-sm relative">
                        <div className="flex justify-between items-center mb-8 border-b border-pink-300 pb-4">
                            <div>
                                <h2 className="text-2xl font-black uppercase tracking-tight text-[#4C0020]">ADMIN PANEL</h2>
                                <p className="text-[9px] font-bold uppercase tracking-wider mt-1 text-[#FF1A93]">Authorized Access</p>
                            </div>
                            <button onClick={() => setView('portfolio')} className="w-10 h-10 neo-embossed neo-interactive flex items-center justify-center font-black text-[#4C0020] hover:text-[#FF1A93]">✕</button>
                        </div>
                        <form onSubmit={handleAdminLogin} className="space-y-6">
                            <div>
                                <label className="text-xs font-black uppercase tracking-wider block mb-2 text-[#802A50] ml-1">Access Pin</label>
                                <input 
                                    type="password" 
                                    className="w-full neo-recessed py-4 px-6 font-black text-center text-2xl tracking-widest outline-none text-[#4C0020]"
                                    value={passInput}
                                    onChange={(e) => setPassInput(e.target.value)}
                                    placeholder="••••••••"
                                    required
                                />
                            </div>
                            {error && <p className="text-red-600 font-bold text-xs uppercase tracking-wide text-center">{error}</p>}
                            <button className="w-full neo-embossed neo-interactive py-4 font-black tracking-widest text-xs uppercase text-[#4C0020] hover:text-[#FF1A93]">
                                VALIDATE & ENTER
                            </button>
                        </form>
                    </div>
                </div>
            );

            // ADMIN CONFIG EDITOR VIEW
            if (view === 'admin') return (
                <div className="min-h-screen p-6 font-sans pb-32 animate-fade-in max-w-lg mx-auto text-[#4C0020]">
                    <Toast />
                    <header className="flex justify-between items-center mb-10 border-b border-pink-300 pb-6">
                        <div>
                            <h1 className="text-3xl font-black uppercase tracking-tight text-[#4C0020]">LINK EDITOR</h1>
                            <p className="text-xs font-bold uppercase tracking-widest mt-1 text-[#802A50]">Configure Destinations</p>
                        </div>
                        <button onClick={() => setView('portfolio')} className="w-10 h-10 neo-embossed neo-interactive flex items-center justify-center font-black text-[#4C0020] hover:text-[#FF1A93]">✕</button>
                    </header>
                    
                    <div className="space-y-6">
                        {Object.keys(links).map(key => (
                            <div key={key} className="neo-embossed p-5">
                                <label className="text-[10px] font-black uppercase tracking-wider text-[#802A50] block mb-2 ml-1">{key.replace('_', ' ')}</label>
                                <input 
                                    className="w-full neo-recessed px-4 py-3 text-sm font-semibold outline-none text-[#4C0020] disabled:opacity-50"
                                    value={links[key] || ''}
                                    disabled={key === 'google_rate'}
                                    onChange={(e) => setLinks({...links, [key]: e.target.value})}
                                    placeholder={`Enter ${key.replace('_', ' ')} link`}
                                />
                                {key === 'google_rate' && (
                                    <p className="text-[10px] text-[#FF1A93] uppercase font-bold tracking-wider mt-2 ml-1">★ Standardized review destination</p>
                                )}
                            </div>
                        ))}
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#FF9ECA] via-[#FF9ECA]/95 to-transparent z-40 max-w-lg mx-auto">
                        <button 
                            onClick={handleSaveChanges} 
                            disabled={isSaving} 
                            className="w-full neo-embossed neo-interactive py-5 font-black tracking-widest text-xs uppercase text-[#4C0020] hover:text-[#FF1A93]"
                        >
                            {isSaving ? "PUBLISHING SETTINGS..." : "PUBLISH LIVE PORTFOLIO"}
                        </button>
                    </div>
                </div>
            );

            // MAIN PORTFOLIO VIEW
            return (
                <div className="min-h-screen px-6 py-10 max-w-md mx-auto relative flex flex-col justify-between animate-fade-in text-[#4C0020]">
                    <Toast />
                    <div>
                        {/* Header Area */}
                        <header className="mb-8 flex justify-between items-start">
                            <div className="neo-embossed p-5 inline-block">
                                <h1 className="text-3xl leading-none font-black tracking-tight text-[#4C0020]">
                                    TAMNNA<br/>
                                    <span className="text-[#FF1A93] inline-block my-1 transform -rotate-1">DUPATTA</span><br/>
                                    HUB
                                </h1>
                                <p className="mt-2 text-[#802A50] font-black text-[9px] uppercase tracking-[0.35em] ml-0.5">The Fine Art of Weaving</p>
                            </div>
                            <div className="neo-embossed w-14 h-14 flex items-center justify-center rotate-3">
                                <span className="text-3xl">🇮🇳</span>
                            </div>
                        </header>

                        {/* Neumorphic Active Alert Banner */}
                        <div className="mb-8 neo-embossed p-5 relative overflow-hidden">
                            <div className="absolute right-2 -bottom-2 text-7xl opacity-5 font-black select-none pointer-events-none">🌸</div>
                            <div className="flex gap-4">
                                <div className="text-3xl p-3 neo-recessed self-start rotate-3">{currentMessage.emoji}</div>
                                <div>
                                    <h4 className="text-[#4C0020] font-black uppercase text-xs tracking-wide">{currentMessage.title}</h4>
                                    <p className="text-[#802A50] text-[11px] leading-relaxed mt-1 font-bold">{currentMessage.text}</p>
                                </div>
                            </div>
                            <div className="mt-4 flex">
                                <a 
                                    href={googleReviewLink} 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="neo-embossed neo-interactive text-[#4C0020] hover:text-[#FF1A93] text-[9px] font-black px-6 py-2.5 uppercase tracking-widest block"
                                >
                                    Write a 5-Star Review
                                </a>
                            </div>
                        </div>

                        {/* Neumorphic Bento Link Grid */}
                        <div className="grid grid-cols-2 gap-5 auto-rows-[140px]">
                            
                            {/* Google Rate Card - Hero Feature */}
                            <a 
                                href={googleReviewLink} 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className="row-span-2 neo-embossed neo-interactive p-6 flex flex-col items-center justify-center text-center relative overflow-hidden"
                            >
                                <div className="text-5xl mb-4 animate-bounce text-[#FF1A93]">
                                    ★
                                </div>
                                <h3 className="text-lg font-black text-[#4C0020] uppercase leading-tight">Rate Us<br/><span className="text-[#FF1A93]">On Google</span></h3>
                                <p className="text-[8px] font-black text-[#802A50] mt-3 uppercase tracking-wider">Share your experience</p>
                                <div className="mt-4 w-9 h-9 neo-recessed flex items-center justify-center text-[#FF1A93] font-black">
                                    →
                                </div>
                            </a>

                            {/* WhatsApp (Replaced Our Culture with standard high quality vector layout) */}
                            <a 
                                href={links.whatsapp || '#'} 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className={`neo-embossed p-4 flex flex-col items-center justify-center ${links.whatsapp ? 'neo-interactive' : 'opacity-40 cursor-not-allowed shadow-none border border-pink-400'}`}
                                onClick={(e) => !links.whatsapp && e.preventDefault()}
                            >
                                <div className="w-11 h-11 neo-recessed mb-2 flex items-center justify-center -rotate-3 text-2xl">
                                    <svg className="w-6 h-6 text-[#25D366]" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.724-1.455L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.625 1.451 5.437 0 9.862-4.414 9.865-9.848.001-2.63-1.019-5.101-2.874-6.958C16.399 1.94 13.913.92 11.285.92c-5.44 0-9.866 4.414-9.869 9.851-.001 1.764.464 3.488 1.344 5.01L1.758 20.3l4.889-1.146zM17.3 14.155c-.285-.143-1.687-.832-1.948-.927-.261-.096-.451-.144-.641.143-.19.287-.736.927-.903 1.118-.166.19-.332.214-.618.071-.285-.143-1.207-.445-2.299-1.42-.85-.758-1.423-1.693-1.59-1.979-.166-.285-.018-.44.124-.581.129-.127.285-.333.428-.5.143-.166.19-.285.285-.476.095-.19.048-.357-.024-.5-.071-.143-.641-1.543-.878-2.112-.23-.556-.464-.48-.641-.489-.166-.008-.357-.01-.548-.01s-.5.071-.762.357c-.261.285-1 .976-1 2.38s1.023 2.761 1.166 2.952c.143.19 2.013 3.074 4.877 4.312.681.295 1.213.471 1.628.603.684.218 1.307.187 1.8.114.549-.081 1.687-.69 1.925-1.357.237-.667.237-1.238.166-1.357-.07-.119-.261-.19-.546-.333z"/>
                                    </svg>
                                </div>
                                <h3 className="text-xs font-black text-[#4C0020] uppercase tracking-wider text-center">WhatsApp</h3>
                            </a>

                            {/* Instagram */}
                            <a 
                                href={links.instagram} 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className="neo-embossed neo-interactive p-4 flex flex-col items-center justify-center"
                            >
                                <div className="w-11 h-11 neo-recessed mb-2 flex items-center justify-center rotate-3 text-2xl">
                                    📸
                                </div>
                                <h3 className="text-xs font-black text-[#4C0020] uppercase tracking-wider text-center">Instagram</h3>
                            </a>

                            {/* Telegram Box */}
                            <a 
                                href={links.telegram || '#'} 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className={`neo-embossed p-4 flex flex-col items-center justify-center ${links.telegram ? 'neo-interactive' : 'opacity-40 cursor-not-allowed shadow-none border border-pink-400'}`}
                                onClick={(e) => !links.telegram && e.preventDefault()}
                            >
                                <div className="w-11 h-11 neo-recessed mb-2 flex items-center justify-center rotate-6 text-2xl">
                                    <svg className="w-6 h-6 text-[#0088cc]" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.18l-1.92 9.04c-.14.63-.52.79-1.05.49l-2.93-2.16-1.41 1.36c-.16.16-.29.29-.6.29l.21-2.99 5.44-4.92c.24-.21-.05-.33-.37-.12l-6.73 4.24-2.9-.91c-.63-.2-1.09-.52-.16-.89l11.31-4.36c.52-.2.98.11.86.88z"/>
                                    </svg>
                                </div>
                                <h3 className="text-xs font-black text-[#4C0020] uppercase tracking-wider text-center">Telegram</h3>
                            </a>

                            {/* Website Box */}
                            <a 
                                href={links.website || '#'} 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className={`neo-embossed p-4 flex flex-col items-center justify-center ${links.website ? 'neo-interactive' : 'opacity-40 cursor-not-allowed shadow-none border border-pink-400'}`}
                                onClick={(e) => !links.website && e.preventDefault()}
                            >
                                <div className="w-11 h-11 neo-recessed mb-2 flex items-center justify-center -rotate-3 text-2xl">
                                    🌐
                                </div>
                                <h3 className="text-xs font-black text-[#4C0020] uppercase tracking-wider text-center">Our Website</h3>
                            </a>

                            {/* Meesho Shop */}
                            <a 
                                href={links.meesho} 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className="neo-embossed neo-interactive p-4 flex flex-col items-center justify-center"
                            >
                                <div className="w-11 h-11 neo-recessed mb-2 flex items-center justify-center rotate-6 text-2xl">
                                    🛍️
                                </div>
                                <h3 className="text-xs font-black text-[#4C0020] uppercase tracking-wider text-center">Meesho Shop</h3>
